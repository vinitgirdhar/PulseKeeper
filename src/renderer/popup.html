<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; font-src 'self' data:; connect-src 'self' http://localhost:7828 http://127.0.0.1:7828">
  <title>PulseKeeper</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup">
  <header class="popup-head drag">
    <svg class="brand-mark" width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="15" fill="#0b1d3a"/>
      <polyline points="4,34 14,34 18,26 22,42 26,16 30,50 34,34 44,34 48,27 52,41 60,34" fill="none" stroke="#60cdff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>PulseKeeper</h1>
    <div class="head-actions">
      <button class="btn btn-icon btn-ghost btn-sm" id="btnCopy" title="Copy visible stories as Markdown" aria-label="Copy as Markdown"><span data-icon="copy"></span></button>
      <button class="btn btn-icon btn-ghost btn-sm" id="btnMarkAllRead" title="Mark all as read" aria-label="Mark all as read"><span data-icon="checkall"></span></button>
      <button class="btn btn-icon btn-ghost btn-sm" id="btnRefreshPopup" title="Refresh" aria-label="Refresh"><span data-icon="refresh"></span></button>
      <button class="btn btn-icon btn-ghost btn-sm" id="btnSettings" title="Open PulseKeeper" aria-label="Open PulseKeeper"><span data-icon="news"></span></button>
      <button class="btn btn-primary btn-sm" id="btnViewAll"><span data-icon="document"></span>Digest</button>
    </div>
  </header>

  <div class="chips-wrap" id="chipsWrap"><div class="chips" id="chips" role="tablist" aria-label="Categories"></div></div>
  <label class="search" for="popupSearch"><span data-icon="search"></span><input class="input" id="popupSearch" type="search" placeholder="Search" autocomplete="off"></label>

  <div class="list" id="itemsList"></div>

  <footer class="popup-foot">
    <div class="status"><span class="dot ok" id="statusDot"></span><span id="statusText">Ready</span></div>
    <span id="itemCount">0 stories</span>
  </footer>
  <div class="hud" id="hud" hidden></div>
</div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="icons.js"></script>
<script src="motion.js"></script>
<script src="popup.js"></script>
</body>
</html>
